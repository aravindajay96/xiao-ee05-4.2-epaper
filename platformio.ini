[platformio]
default_envs = ee05_4in2

[env:ee05_4in2]
; Seeed's PlatformIO platform package provides the XIAO ESP32-S3 board definition.
platform = https://github.com/Seeed-Studio/platform-seeedboards.git
board = seeed-xiao-esp32-s3-plus
framework = arduino

; Explicitly provide flash mode for ESP32-S3 bootloader image generation.
board_build.flash_mode = qio

upload_speed = 115200
monitor_speed = 115200

; Required EE0x ESP32-S3 memory configuration (OPI PSRAM).
board_build.arduino.memory_type = qio_opi

build_flags =
    -D BOARD_HAS_PSRAM
    -I src

; Use the Seeed_GFX API required by EPaper / TFT_eSPI-style sketches.
; Do not add TFT_eSPI or Seeed_GFX2 as a second display library.
lib_deps =
    https://github.com/Seeed-Studio/Seeed_GFX
